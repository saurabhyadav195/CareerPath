<!-- Site Header with Logo -->
<header>
  <div class="header-inner">
    <div class="header-brand">
      <img src="assets/images/logo.png" alt="CareerPath Logo">
      <div class="header-text">
        <h1>CareerPath</h1>
        <p>Your Gateway to Professional Growth &amp; Career Guidance</p>
      </div>
    </div>
  </div>
</header>

<!-- Navigation Bar -->
<nav class="navbar navbar-default" style="margin-bottom:0; border-radius:0;">
  <div class="container-fluid" style="max-width:1100px; margin:0 auto;">

    <div class="navbar-header">
      <button
        type="button"
        class="navbar-toggle collapsed"
        (click)="toggleMenu()">
        <span class="sr-only">Toggle navigation</span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <a class="navbar-brand" routerLink="/">CareerPath</a>
    </div>

    <div [class.in]="!isMenuCollapsed" class="collapse navbar-collapse">
      <ul class="nav navbar-nav">
        <li routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
          <a routerLink="/">Home</a>
        </li>
        <li routerLinkActive="active">
          <a routerLink="/jobs">Jobs</a>
        </li>
        <li routerLinkActive="active">
          <a routerLink="/resources">Resources</a>
        </li>
        <li routerLinkActive="active">
          <a routerLink="/register">Register</a>
        </li>
      </ul>
    </div>

  </div>
</nav>
