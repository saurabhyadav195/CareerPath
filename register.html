<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CareerPath - Student Registration Form">
    <title>Register - CareerPath</title>

    <!-- Bootstrap 3 CSS CDN -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ========== Bootstrap 3 Navbar ========== -->
    <nav class="navbar navbar-default navbar-static-top" role="navigation">
        <div class="container">

            <div class="navbar-header">
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse"
                    data-target="#main-navbar" aria-expanded="false">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="index.html">
                    <img src="images/logo.png" alt="CareerPath Logo"
                        style="height:30px; width:auto; display:inline-block; vertical-align:middle; margin-right:8px;">
                    CareerPath
                </a>
            </div>

            <div class="collapse navbar-collapse" id="main-navbar">
                <ul class="nav navbar-nav navbar-right">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="jobs.html">Job Listings</a></li>
                    <li><a href="resources.html">Career Resources</a></li>
                    <li class="active"><a href="register.html">Register</a></li>
                </ul>
            </div>

        </div>
    </nav>

    <!-- ========== Main Content ========== -->
    <main>
        <div class="container">

            <section class="bs-section" id="registration">
                <h2>Student Registration</h2>
                <p>Fields marked with <strong>*</strong> are required.</p>

                <form action="#" method="post" id="reg-form">

                    <fieldset>
                        <legend>Registration Form</legend>

                        <!-- Row 1: Full Name + Email -->
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="control-label" for="fullname">Full Name *</label>
                                    <input type="text" class="form-control" id="fullname" name="fullname"
                                        placeholder="Enter full name" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="control-label" for="email">Email *</label>
                                    <input type="email" class="form-control" id="email" name="email"
                                        placeholder="Enter email address" required>
                                </div>
                            </div>
                        </div>

                        <!-- Row 2: Phone + Qualification -->
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="control-label" for="phone">Phone *</label>
                                    <input type="tel" class="form-control" id="phone" name="phone"
                                        placeholder="10-digit mobile number"
                                        pattern="[0-9]{10}" maxlength="10" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="control-label" for="qualification">Qualification *</label>
                                    <select class="form-control" id="qualification" name="qualification" required>
                                        <option value="">-- Select --</option>
                                        <option value="ssc">SSC (10th)</option>
                                        <option value="hsc">HSC (12th)</option>
                                        <option value="diploma">Diploma</option>
                                        <option value="ug">Under Graduate (B.E./B.Tech/B.Sc.)</option>
                                        <option value="pg">Post Graduate (M.E./M.Tech/MBA)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Row 3: Skills + Preferred Job Role -->
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="control-label" for="skills">Skills</label>
                                    <input type="text" class="form-control" id="skills" name="skills"
                                        placeholder="e.g. HTML, CSS, Java">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="control-label" for="jobrole">Preferred Job Role</label>
                                    <input type="text" class="form-control" id="jobrole" name="jobrole"
                                        placeholder="e.g. Software Developer">
                                </div>
                            </div>
                        </div>

                        <!-- Row 4: Resume Upload -->
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="control-label" for="resume">Upload Resume</label>
                                    <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
                                </div>
                            </div>
                        </div>

                        <!-- Row 5: Message (full width) -->
                        <div class="row">
                            <div class="col-xs-12">
                                <div class="form-group">
                                    <label class="control-label" for="message">Message</label>
                                    <textarea class="form-control" id="message" name="message" rows="3"
                                        placeholder="Write a short message..."></textarea>
                                </div>
                            </div>
                        </div>

                    </fieldset>

                    <!-- Buttons -->
                    <div class="row">
                        <div class="col-xs-12">
                            <button type="submit" class="btn btn-primary" id="btn-submit">Submit</button>
                            <button type="reset" class="btn btn-default" id="btn-reset"
                                style="margin-left:10px;">Reset</button>
                        </div>
                    </div>

                </form>

            </section>

        </div>
    </main>

    <!-- ========== Footer ========== -->
    <footer class="site-footer">
        <div class="container">
            <div class="row">
                <div class="col-xs-12 text-center">
                    <p><strong>CareerPath</strong> &mdash; Career Guidance Portal</p>
                    <div class="footer-links">
                        <a href="index.html">Home</a>
                        <a href="jobs.html">Job Listings</a>
                        <a href="resources.html">Career Resources</a>
                        <a href="register.html">Register</a>
                    </div>
                    <p>&copy; 2024 CareerPath. All Rights Reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- jQuery (required by Bootstrap 3) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- Bootstrap 3 JS CDN -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

</body>
</html>
